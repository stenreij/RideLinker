<!-- header.component.html -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

<nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow" style="background-color: #2444ea; padding: 0px;">
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarCenteredExample"
    aria-controls="navbarCenteredExample" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <a routerLink="/home" class="navbar-brand">
    <img src="/assets/cm.png" alt="Your Logo" style="max-height: 60px; width: auto;">
  </a>

  <div class="collapse navbar-collapse justify-content-between align-items-center" id="navbarCenteredExample">
    <ul class="navbar-nav align-items-center">
      <li class="nav-item" *ngIf="isLoggedIn()">
        <a routerLink="/home" routerLinkActive="router-link-active" class="nav-link" style="color: #ffffff;">Home</a>
      </li>
      <li class="nav-item" [ngClass]="{ 'router-link-active': activeLink === '/trip' }" *ngIf="isLoggedIn()">
        <a routerLink="/trip" class="nav-link" style="color: #ffffff;">Mijn Ritten</a>
      </li>
      <li class="nav-item" [ngClass]="{ 'router-link-active': activeLink === '/trip/new' }" *ngIf="isLoggedIn()">
        <a routerLink="/trip/new" class="nav-link" style="color: #ffffff;">Rit toevoegen</a>
      </li>
      <li class="nav-item" *ngIf="isLoggedIn()">
        <a routerLink="/car" routerLinkActive="router-link-active" class="nav-link" style="color: #ffffff ;">Auto's</a>
      </li>
    </ul>
    <ul class="navbar-nav align-items-center">
      <li class="nav-item-user" style="color: #ffffff; margin-right: 15px;">
        <a *ngIf="isLoggedIn()">
          <div style="display: flex; align-items: center;">
            <i class="fa fa-user-circle-o" style="font-size:30px; margin-right: 7px;"></i>
            {{ currentUser }}
          </div>
        </a>
      </li>
      <div *ngIf="isLoggedIn()" class="vl" style="border-left: 8px solid white; height: 70px; margin-right: 10px;">
      </div>
      <li class="nav-item">
        <a *ngIf="!isLoggedIn()" routerLink="/login" routerLinkActive="router-link-active" class="nav-link align"
          style="color: #ffffff ;">Inloggen</a>
        <a *ngIf="isLoggedIn()" (click)="logout()" routerLink="/login" routerLinkActive="router-link-active"
          class="nav-link align-items-center" style="color: #ffffff ;">
          <div style="display: flex; align-items: center;">
            <i class="fa fa-sign-out" style="font-size:30px; margin-right: 7px;"></i>
            Uitloggen
          </div>
        </a>
      </li>
    </ul>
  </div>
</nav>
