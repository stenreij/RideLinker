<div class="container mt-2">
  <div class="d-flex justify-content-center">
    <h1>Bedrijfsauto's</h1>
  </div>
  <div class="container container-fluid overflow-auto mt-2" style="height: 70vh;">
  <div class="container container-fluid overflow-auto" style="height: 70vh;">
    <div class="row">
      <div class="col-md-3 d-flex justify-content-center" *ngFor="let car of cars">
        <div class="card shadow mb-3">
          <a [routerLink]="'/car/' + car.id" class="card-block stretched-link text-decoration-none navBarColor">
            <img src="{{ car.image }}" class="card-img-top rounded-0" alt="card-image" width="300" height="200" style="object-fit: cover; object-position: center" />
            <div class="card-body card-text">
              <div class="d-flex align-items-center mb-2">
                <i-bs name="car-front" width="20" height="20" class="mr-2" style="padding-right: 0.5vh;"></i-bs>
                <h4 class="mb-0">{{car.brand}} {{ car.model }}</h4>
              </div>
              <div class="d-flex align-items-center mb-2">
                <i-bs name="geo-alt" width="20" height="20" class="mr-2" style="padding-right: 0.5vh;"></i-bs>
                <h6 class="card-subtitle mt-1 mb-0">{{ car.location.name }}</h6>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
