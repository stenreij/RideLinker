<div *ngIf="car" class="container pb-4">
  <div class="row m-5 no-gutters shadow-lg">
    <div class="col-md-6 d-none d-md-block p-0">
        <img [src]="car?.image" class="card-img img-fluid" alt="Car Image" 
        style="min-width: 100%; max-height: 100%">
      </div>
      <div class="col-md-6 bg-white pt-4 ps-4">
        <div class="d-flex flex-column">
          <div class="d-flex align-items-center mt-2 mb-4">
            <i-bs name="car-front" width="30" height="30" class="mr-2" style="padding-right: 0.8vh;"></i-bs>
            <h2 class="mb-0">{{car?.brand}} {{ car?.model }}</h2>
          </div>
          <div class="d-flex align-items-center mb-2">
            <i-bs name="geo-alt" width="30" height="30" class="mr-2" style="padding-right: 0.8vh;"></i-bs>
            <p class="mb-0">{{ car?.location?.name }}, {{ car?.location?.address }}</p>
          </div>
        </div>
    </div>
  </div>
</div>
